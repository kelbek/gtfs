<div>
  <div ng-if="!c.data.hasFeed" class="gtfs-card gtfs-muted">
    <i class="fa fa-info-circle" aria-hidden="true"></i>
    No timetable is published yet.
  </div>

  <div ng-if="c.data.hasFeed &amp;&amp; !c.data.route" class="gtfs-card gtfs-muted">
    Route not found.
  </div>

  <div ng-if="c.data.hasFeed &amp;&amp; c.data.route">
    <div class="gtfs-hero">
      <gtfs-route-badge route="c.data.route.route"></gtfs-route-badge>
      <h1 ng-bind="c.data.route.route.display_name"></h1>
    </div>

    <div class="gtfs-card" ng-repeat="dir in c.data.route.directions track by $index">
      <h2>
        <span ng-if="dir.headsign">Towards <span ng-bind="dir.headsign"></span></span>
        <span ng-if="!dir.headsign">Direction {{dir.direction_id}}</span>
      </h2>
      <ol class="gtfs-result-list">
        <li ng-repeat="s in dir.stops track by s.stop_id">
          <a ng-href="?id={{c.data.stopPage}}&amp;stop_id={{s.stop_id}}" ng-bind="s.stop_name"></a>
        </li>
      </ol>
    </div>

    <div class="gtfs-card">
      <h2>Trips</h2>
      <form class="form-inline" ng-submit="c.reload()">
        <div class="form-group">
          <label for="gtfs-route-date">Date</label>
          <input id="gtfs-route-date" type="date" class="form-control" ng-model="c.date" />
        </div>
        <div class="form-group">
          <label for="gtfs-route-dir">Direction</label>
          <select id="gtfs-route-dir" class="form-control" ng-model="c.direction">
            <option value="">All directions</option>
            <option ng-repeat="dir in c.data.route.directions track by $index"
                    value="{{dir.direction_id}}">
              {{dir.headsign || ('Direction ' + dir.direction_id)}}
            </option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Show trips</button>
      </form>

      <table class="table" ng-if="c.data.trips.length">
        <caption class="sr-only">Trips on this route</caption>
        <thead>
          <tr>
            <th scope="col">From</th>
            <th scope="col">Departure</th>
            <th scope="col">Destination</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="t in c.data.trips track by t.trip_id">
            <td ng-bind="t.start_stop"></td>
            <td>
              <span class="gtfs-departure-time">{{t.departure}}</span>
              <span class="gtfs-nextday" ng-if="t.departure_next_day">+1 day</span>
            </td>
            <td>
              <a ng-href="?id={{c.data.tripPage}}&amp;trip_id={{t.trip_id}}" ng-bind="t.headsign"></a>
            </td>
          </tr>
        </tbody>
      </table>
      <p class="gtfs-muted" ng-if="!c.data.trips.length">
        No trips found for the selected date and direction.
      </p>
    </div>
  </div>
</div>
